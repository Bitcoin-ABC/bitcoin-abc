include = [
    "*.py",
    "electrum/electrum-abc"
]
force-exclude = true
# Any change in the excluded files here need to also be modified in the "ruff-check" and "ruff-format"
# linters in the .arclint file.
exclude = [
    "contrib/apple-sdk-tools",
    "electrum/electrumabc_gui/qt/icons.py",
    "*_pb2.py",
    "src/crc32c",
    "src/secp256k1",
]

target-version = "py310"

[lint]
select = [
    "E",
    "F",
    "A",
    "C",
    "I",
    "ASYNC",
    "FLY",
    "PLE",
    "B006", # mutable-argument-default
    "B008", # function-call-in-default-argument
    "B912", # map-without-explicit-strict
    "RUF059", # unused-unpacked-variable
    "RUF064", # non-octal-permissions
    "UP006", # non-pep585-annotation
    "UP007", # non-pep604-annotation-union
    "UP031", # printf-string-formatting
    "UP032", # f-string
    "UP037", # quoted-annotation
    "UP045", # non-pep604-annotation-optional
]

ignore = [
    "A003", # builtin-attribute-shadowing
    "E203", # whitespace-before-punctuation
    "E303", # too-many-blank-lines
    "E305", # blank-lines-after-function-or-class
    "E501", # line-too-long
    "C901", # complex-structure
]

[lint.per-file-ignores]
# don't enforce f-strings in the Electrum codebase for now
"electrum/*" = ["UP031", "UP032"]
# enforce only in the Electrum codebase for now
"!electrum/*" = [
    "UP006",  # non-pep585-annotation
    "UP007", # non-pep604-annotation-union
    "UP045", # non-pep604-annotation-optional
]

[lint.isort]
known-first-party = [
    "electrumabc",
    "electrumabc_gui",
    "electrumabc_plugins"
]

[lint.flake8-annotations]
mypy-init-return = true
