# pay.e.cash is a single static page that reads the URL to decide what to show.
#
# Agora action links live on the /token path, see
# doc/standards/agora-deeplink.md, so paths that do not map to a file must serve
# index.html instead of returning 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
